<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 560" width="1200" height="560" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#475569"/></marker>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/></marker>
    <marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#7c3aed"/></marker>
  </defs>
  <rect width="1200" height="560" fill="#ffffff"/>
  <text x="40" y="44" font-size="26" font-weight="700" fill="#0f172a">Policy application demo</text>

  <!-- Entry points -->
  <rect x="40" y="150" width="170" height="70" rx="10" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="125" y="181" font-size="16" font-weight="700" fill="#0f172a" text-anchor="middle">Client</text>
  <text x="125" y="203" font-size="13" fill="#475569" text-anchor="middle">API call</text>
  <rect x="40" y="290" width="170" height="70" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
  <text x="125" y="321" font-size="16" font-weight="700" fill="#1e3a8a" text-anchor="middle">IBM MQ</text>
  <text x="125" y="343" font-size="13" fill="#1e3a8a" text-anchor="middle">queue message</text>
  <text x="125" y="126" font-size="13" font-weight="600" fill="#64748b" text-anchor="middle">Two ways in</text>
  <path d="M210,185 L286,238" stroke="#475569" stroke-width="2" fill="none" marker-end="url(#a)"/>
  <path d="M210,325 L286,272" stroke="#475569" stroke-width="2" fill="none" marker-end="url(#a)"/>

  <!-- Flow 1 -->
  <rect x="290" y="200" width="180" height="110" rx="12" fill="#eef2ff" stroke="#6366f1" stroke-width="2"/>
  <text x="380" y="245" font-size="18" font-weight="700" fill="#3730a3" text-anchor="middle">1 · Apply</text>
  <text x="380" y="270" font-size="13" fill="#4338ca" text-anchor="middle">Orchestrate + transform</text>

  <rect x="300" y="60" width="160" height="50" rx="8" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="380" y="91" font-size="15" font-weight="700" fill="#0f172a" text-anchor="middle">SOAP service</text>
  <line x1="360" y1="198" x2="360" y2="112" stroke="#475569" stroke-width="2" marker-end="url(#a)"/>
  <rect x="300" y="400" width="130" height="50" rx="8" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="365" y="431" font-size="15" font-weight="700" fill="#0f172a" text-anchor="middle">MySQL</text>
  <line x1="360" y1="312" x2="360" y2="398" stroke="#475569" stroke-width="2" marker-end="url(#a)"/>

  <!-- RabbitMQ -->
  <line x1="470" y1="255" x2="548" y2="255" stroke="#475569" stroke-width="2" marker-end="url(#a)"/>
  <text x="509" y="245" font-size="12" fill="#475569" text-anchor="middle">event</text>
  <rect x="550" y="215" width="140" height="80" rx="10" fill="#fff7ed" stroke="#f97316" stroke-width="1.5"/>
  <text x="620" y="262" font-size="16" font-weight="700" fill="#9a3412" text-anchor="middle">RabbitMQ</text>

  <!-- Flow 2 -->
  <line x1="690" y1="255" x2="768" y2="255" stroke="#475569" stroke-width="2" marker-end="url(#a)"/>
  <rect x="770" y="200" width="180" height="110" rx="12" fill="#eef2ff" stroke="#6366f1" stroke-width="2"/>
  <text x="860" y="245" font-size="18" font-weight="700" fill="#3730a3" text-anchor="middle">2 · Underwrite</text>
  <text x="860" y="270" font-size="13" fill="#4338ca" text-anchor="middle">Retry 3 times</text>

  <!-- Right side -->
  <rect x="1010" y="160" width="160" height="60" rx="8" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="1090" y="196" font-size="15" font-weight="700" fill="#0f172a" text-anchor="middle">Underwriting</text>
  <rect x="1010" y="290" width="160" height="60" rx="8" fill="#fef2f2" stroke="#dc2626" stroke-width="1.5"/>
  <text x="1090" y="326" font-size="15" font-weight="700" fill="#991b1b" text-anchor="middle">Dead-letter queue</text>
  <line x1="950" y1="235" x2="1008" y2="198" stroke="#475569" stroke-width="2" marker-end="url(#a)"/>
  <line x1="950" y1="278" x2="1008" y2="318" stroke="#dc2626" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#ar)"/>
  <text x="1000" y="288" font-size="12" fill="#dc2626" text-anchor="end">fails</text>

  <!-- Dynatrace -->
  <rect x="560" y="440" width="220" height="56" rx="10" fill="#f5f3ff" stroke="#7c3aed" stroke-width="1.5"/>
  <text x="670" y="474" font-size="16" font-weight="700" fill="#5b21b6" text-anchor="middle">Dynatrace</text>
  <path d="M450,312 L450,468 L558,468" stroke="#7c3aed" stroke-width="2" stroke-dasharray="6 4" fill="none" marker-end="url(#ag)"/>
  <path d="M860,312 L860,468 L782,468" stroke="#7c3aed" stroke-width="2" stroke-dasharray="6 4" fill="none" marker-end="url(#ag)"/>

  <!-- Legend -->
  <rect x="40" y="496" width="18" height="14" rx="3" fill="#eef2ff" stroke="#6366f1" stroke-width="1.5"/>
  <text x="66" y="508" font-size="12" fill="#475569">Built in WSO2 Integrator</text>
  <line x1="230" y1="503" x2="262" y2="503" stroke="#dc2626" stroke-width="2" stroke-dasharray="6 4"/><text x="270" y="508" font-size="12" fill="#475569">Failure</text>
  <line x1="340" y1="503" x2="372" y2="503" stroke="#7c3aed" stroke-width="2" stroke-dasharray="6 4"/><text x="380" y="508" font-size="12" fill="#475569">Traces</text>
</svg>
